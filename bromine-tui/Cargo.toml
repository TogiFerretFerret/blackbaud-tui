[package]
name = "bromine-tui"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
bromine = { version = "0.1.0", path = "../bromine" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
crossterm = "0.29.0"
dirs = "7.0.0"
open = "5.4.4"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.2"

[dev-dependencies]
mockito = "1.7.2"
